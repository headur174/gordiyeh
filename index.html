<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;

          // Provide writable getter/setter on window to prevent "Cannot set property fetch of #<Window> which has only a getter"
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || (typeof Window !== 'undefined' && Window.prototype);
            if (proto) {
              var protoFetch = window.fetch ? window.fetch.bind(window) : undefined;
              var activeProtoFetch = protoFetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return activeProtoFetch;
                },
                set: function(fn) {
                  activeProtoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();

      // Gracefully silence expected sandbox Vite HMR WebSocket connection notices
      window.addEventListener('unhandledrejection', function(event) {
        try {
          var reason = event.reason;
          var msg = (reason && reason.message) ? reason.message : (typeof reason === 'string' ? reason : '');
          if (msg && msg.indexOf('WebSocket') !== -1) {
            event.preventDefault();
          }
        } catch (e) {}
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="گُردیه | فروشگاه گجت‌های کاربردی برای خونه، سفر و باشگاه" />
    <meta property="og:description" content="برای هر محصول می‌گیم چه مشکلی رو حل می‌کنه، چه کاری از دستش برنمی‌آد و شرایط تست و تعویضش چیه. گجت‌های کاربردی با توضیح صادقانه." />
    <meta property="og:type" content="website" />

    <!-- Instant local font + WebP logo preload (Zero external render-blocking roundtrips) -->
    <link rel="preload" as="image" type="image/webp" href="/assets/gordiyeh-logo-emblem.webp?v=7" />
    <meta name="theme-color" content="#F3EDE0" />
    <style>
      #gordiyeh-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: #F3EDE0;
        color: #182B22;
        font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
        transition: opacity 280ms ease, visibility 280ms ease;
      }
      html[data-theme="forest-dark"] #gordiyeh-boot-loader {
        background-color: #09120E;
        color: #F2EFE7;
      }
      #gordiyeh-boot-loader.is-ready {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .gordiyeh-boot-arch {
        width: 74px;
        height: 78px;
        padding: 3px;
        border-radius: 54px 54px 5px 5px;
        background: linear-gradient(180deg, #2D6A4F 0%, #1E4635 100%);
        box-shadow: 0 12px 28px rgba(24, 43, 34, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gordiyeh-boot-inner {
        width: 100%;
        height: 100%;
        border-radius: 50px 50px 3px 3px;
        background: radial-gradient(ellipse at 50% 38%, #FBF7EE 0%, #EADFC6 62%, #C9D7BE 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
      }
      html[data-theme="forest-dark"] .gordiyeh-boot-inner {
        background: radial-gradient(ellipse at 50% 38%, rgba(209, 250, 229, 0.90) 0%, rgba(110, 231, 183, 0.48) 56%, #133829 100%);
      }
      .gordiyeh-boot-track {
        width: 168px;
        height: 5px;
        border-radius: 999px;
        background: rgba(30, 70, 53, 0.16);
        overflow: hidden;
      }
      .gordiyeh-boot-fill {
        width: 48%;
        height: 100%;
        border-radius: 999px;
        background: #1E4635;
        animation: gordiyeh-boot-slide 1.15s ease-in-out infinite;
      }
      html[data-theme="forest-dark"] .gordiyeh-boot-fill {
        background: #34D399;
      }
      @keyframes gordiyeh-boot-slide {
        0% { transform: translateX(130%); }
        50% { transform: translateX(-15%); }
        100% { transform: translateX(-140%); }
      }
    </style>
    <script>
      (function() {
        try {
          var key = 'gordiyeh_theme';
          var saved = localStorage.getItem(key);
          var theme = null;
          if (saved === 'violet-dark') {
            theme = 'forest-dark';
            localStorage.setItem(key, theme);
          } else if (saved === 'violet-light') {
            theme = 'forest-light';
            localStorage.setItem(key, theme);
          } else if (saved === 'forest-dark' || saved === 'forest-light') {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'forest-dark';
          } else {
            theme = 'forest-light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'forest-dark' ? '#09120E' : '#F3EDE0');
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="gordiyeh-boot-loader" role="status" aria-live="polite">
      <div class="gordiyeh-boot-arch">
        <div class="gordiyeh-boot-inner">
          <img src="/assets/gordiyeh-logo-emblem.webp?v=7" alt="گُردیه" width="52" height="52" style="width:100%;height:100%;object-fit:contain;" />
        </div>
      </div>
      <div class="gordiyeh-boot-track"><div class="gordiyeh-boot-fill"></div></div>
      <div style="font-size:12px;font-weight:700;opacity:0.9;">در حال آماده‌سازی گُردیه...</div>
    </div>
    <script>
      setTimeout(function() {
        var el = document.getElementById('gordiyeh-boot-loader');
        if (el) el.classList.add('is-ready');
      }, 2200);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
